<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header class="navbar">
            <h2>Lesson App</h2>
        </header>

        <main>
            <p v-if="loading">Loading Lessons...</p>
            <p v-else-if="error">{{ error }}</p>

            <div v-else class="lesson-grid">
                <div class="lesson-card" v-for="lesson in lessons" :key="lesson._id">
                    <h2>{{ lesson.lesson }}</h2>
                    <p class="subject">{{ lesson.subject }}</p>
                    <p>Teacher: {{ lesson.teacher }}</p>
                    <p>Price: Rs {{ lesson.price }}</p>
                    <p>Availability: {{ lesson.subject }}</p>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.js"></script>
    <script src="app.js"></script>
</body>
</html>
